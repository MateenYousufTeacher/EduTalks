<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Physics Laboratory — Dr. Mateen Yousuf</title>
<meta name="description" content="An offline, interactive Virtual Physics Laboratory with 10 premium simulations for Classes 6–12. Created by Dr. Mateen Yousuf, School Education Department, Kashmir.">
<meta name="theme-color" content="#0D47A1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ SPLASH / TITLE SCREEN ============ -->
<div id="splash">
  <canvas id="splashCanvas"></canvas>
  <div class="splash-content">
    <div class="splash-title">Virtual Physics<br>Laboratory</div>
    <p class="splash-subtitle">Explore Physics through Interactive Experiments</p>

    <div class="dev-card">
      <img class="dev-photo" src="images/developer.jpg" alt="Photo of Dr. Mateen Yousuf">
      <div class="dev-info">
        <div class="dev-label">Created by</div>
        <div class="dev-name">Dr. Mateen Yousuf</div>
        <div class="dev-role">Teacher · School Education Department, Kashmir</div>
      </div>
    </div>
    <br>
    <button class="splash-enter" id="enterLab">Enter the Lab →</button>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="flask"></span> <span class="brand-text">Virtual Physics Lab</span></div>
    <div class="topbar-spacer"></div>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" placeholder="Search simulations… (press Enter)">
    </div>
    <button class="icon-btn" id="themeToggleBtn" title="Toggle dark mode"></button>
  </header>

  <nav class="navrail" id="navrail"></nav>

  <main id="view"></main>

  <nav class="bottomnav">
    <div class="row" id="bottomnavRow"></div>
  </nav>
</div>

<script src="js/app.js"></script>
<script src="js/sims/motion.js"></script>
<script src="js/sims/newton.js"></script>
<script src="js/sims/friction.js"></script>
<script src="js/sims/gravity.js"></script>
<script src="js/sims/energy.js"></script>
<script src="js/sims/pressure.js"></script>
<script src="js/sims/heat.js"></script>
<script src="js/sims/optics.js"></script>
<script src="js/sims/circuit.js"></script>
<script src="js/sims/magnetism.js"></script>
</body>
</html>
