<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Virtual Chemistry Laboratory — Dr. Mateen Yousuf</title>
<meta name="description" content="Virtual Chemistry Laboratory — 10 fully offline interactive chemistry simulations. Created by Dr. Mateen Yousuf, School Education Department, Kashmir.">
<meta name="theme-color" content="#0D47A1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chem Lab">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <!-- 1. SPLASH -->
  <section class="screen active" id="splash">
    <div class="stars"></div>
    <div class="splash-inner">
      <svg class="logo-flask" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="6" width="8" height="14" rx="1" fill="#E3F2FD"/>
        <path d="M24 20 L40 20 L48 50 Q49 56 42 56 L22 56 Q15 56 16 50 Z" fill="#E3F2FD" stroke="#26C6DA" stroke-width="1.5"/>
        <path d="M20.5 40 L43.5 40 L48 50 Q49 56 42 56 L22 56 Q15 56 16 50 Z" fill="#FFB300" opacity="0.9"/>
        <circle cx="30" cy="47" r="1.6" fill="#fff" opacity=".7"/>
        <circle cx="35" cy="44" r="1.1" fill="#fff" opacity=".6"/>
      </svg>
      <h1>Virtual <span class="accent">Chemistry</span><br>Laboratory</h1>
      <p class="tagline">10 interactive simulations · 100% offline</p>
      <img class="creator-photo" src="assets/mateen-photo.jpg" alt="Photo of Dr. Mateen Yousuf">
      <div class="creator-name">Dr. Mateen Yousuf</div>
      <div class="creator-role">Teacher, School Education Department, Kashmir</div>
      <div class="progress-track"><div class="progress-fill" id="splashProgressFill"></div></div>
      <div class="loading-text">LOADING LABORATORY…</div>
    </div>
  </section>

  <!-- 2. HOME -->
  <section class="screen" id="screenHome">
    <div class="appbar">
      <h2>Virtual Chemistry Lab</h2>
      <span class="xp-pill" id="xpPill">⚡ 0 XP · Lv.1</span>
      <button class="icon-btn" id="installBtn" title="Install app" style="display:none;">⬇️</button>
    </div>
    <div class="content" id="homeContent"></div>
    <nav class="bottom-nav">
      <button data-nav="home" id="navHome" class="active"><span class="nav-ic">🏠</span>Home</button>
      <button data-nav="sims" id="navSims"><span class="nav-ic">🧪</span>Simulations</button>
      <button data-nav="favorites" id="navFav"><span class="nav-ic">⭐</span>Favorites</button>
      <button data-nav="profile" id="navProfile"><span class="nav-ic">👤</span>Profile</button>
    </nav>
  </section>

  <!-- 3. SIMULATION LIST -->
  <section class="screen" id="screenSimList">
    <div class="appbar">
      <button class="icon-btn" id="backFromList">←</button>
      <h2>All Simulations</h2>
    </div>
    <div class="content" id="simListContent"></div>
    <nav class="bottom-nav">
      <button data-nav="home" onclick="goHome()"><span class="nav-ic">🏠</span>Home</button>
      <button data-nav="sims" class="active"><span class="nav-ic">🧪</span>Simulations</button>
      <button data-nav="favorites" onclick="goFavorites()"><span class="nav-ic">⭐</span>Favorites</button>
      <button data-nav="profile" onclick="goProfile()"><span class="nav-ic">👤</span>Profile</button>
    </nav>
  </section>

  <!-- 4. SIMULATION WORKSPACE -->
  <section class="screen" id="screenSim">
    <div class="sim-topbar">
      <button class="icon-btn" id="backFromSim">←</button>
      <h2 id="simTitle">Simulation</h2>
      <button class="icon-btn" id="favToggleBtn" title="Favorite" onclick="toggleFavoriteCurrentSim()">⭐</button>
    </div>
    <div class="content no-pad-bottom" id="simContainer"></div>
  </section>

  <!-- 5. FAVORITES -->
  <section class="screen" id="screenFavorites">
    <div class="appbar">
      <button class="icon-btn" id="backFromFav">←</button>
      <h2>Favorites</h2>
    </div>
    <div class="content" id="favContent"></div>
    <nav class="bottom-nav">
      <button data-nav="home" onclick="goHome()"><span class="nav-ic">🏠</span>Home</button>
      <button data-nav="sims" onclick="goSimList()"><span class="nav-ic">🧪</span>Simulations</button>
      <button data-nav="favorites" class="active"><span class="nav-ic">⭐</span>Favorites</button>
      <button data-nav="profile" onclick="goProfile()"><span class="nav-ic">👤</span>Profile</button>
    </nav>
  </section>

  <!-- 6. PROFILE / INFO -->
  <section class="screen" id="screenProfile">
    <div class="appbar">
      <button class="icon-btn" id="backFromProfile">←</button>
      <h2>Profile</h2>
    </div>
    <div class="content" id="profileContent"></div>
    <nav class="bottom-nav">
      <button data-nav="home" onclick="goHome()"><span class="nav-ic">🏠</span>Home</button>
      <button data-nav="sims" onclick="goSimList()"><span class="nav-ic">🧪</span>Simulations</button>
      <button data-nav="favorites" onclick="goFavorites()"><span class="nav-ic">⭐</span>Favorites</button>
      <button data-nav="profile" class="active"><span class="nav-ic">👤</span>Profile</button>
    </nav>
  </section>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- TOASTS -->
  <div class="toast-stack" id="toastStack"></div>

</div>

<script src="js/app.js"></script>
<script src="js/simulations/thermo.js"></script>
<script src="js/simulations/kinetics.js"></script>
<script src="js/simulations/equilibrium.js"></script>
<script src="js/simulations/gaslab.js"></script>
<script src="js/simulations/solution.js"></script>
<script src="js/simulations/solubility.js"></script>
<script src="js/simulations/spectrum.js"></script>
<script src="js/simulations/nuclear.js"></script>
<script src="js/simulations/crystal.js"></script>
<script src="js/simulations/atmosphere.js"></script>
</body>
</html>
