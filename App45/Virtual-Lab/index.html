<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Virtual Geography Laboratory</title>
<meta name="description" content="Explore Earth through 10 premium interactive geography simulations — offline Progressive Web App by Dr. Mateen Yousuf.">
<meta name="theme-color" content="#0D47A1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- Note: Poppins / Nunito Sans are referenced by name for the design system's typography;
     the app relies on system-installed fonts with a matching sans-serif fallback so the
     interface renders identically with zero network access, keeping the app 100% offline. -->

<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ SPLASH / TITLE SCREEN ============ -->
<div id="splash">
  <canvas id="splash-canvas"></canvas>
  <div class="splash-content">
    <span class="eyebrow">🌍 Offline Progressive Web App</span>
    <h1>Virtual <span>Geography</span><br>Laboratory</h1>
    <p class="subtitle">Explore Earth Through Interactive Virtual Simulations</p>

    <div class="dev-credit">
      <img src="assets/developer-photo.jpg" alt="Dr. Mateen Yousuf">
      <div class="dev-text">
        <div class="by">Created by</div>
        <div class="name">Dr. Mateen Yousuf</div>
        <div class="role">Teacher, School Education Department<br>Kashmir</div>
      </div>
    </div>

    <div class="splash-actions">
      <button class="btn btn-primary" id="enter-app">🚀 Enter Laboratory</button>
    </div>
    <div class="splash-progress">
      <div class="progress-bar"><i id="splash-bar" style="width:0%"></i></div>
      <div class="label" id="splash-label">Loading 10 simulations…</div>
    </div>
  </div>
</div>

<!-- ============ APP ROOT (rendered by JS router) ============ -->
<div id="app-root"></div>

<script>
/* Splash animated background: rotating globe grid, mountains, satellite, particles */
(function(){
  const canvas = document.getElementById('splash-canvas');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth*devicePixelRatio; canvas.height = innerHeight*devicePixelRatio; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px'; }
  resize(); window.addEventListener('resize', resize);
  let t=0;
  const stars = Array.from({length:80}, ()=>({x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.3, tw:Math.random()*Math.PI*2}));
  function draw(){
    const dpr=devicePixelRatio, w=canvas.width/dpr, h=canvas.height/dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    t+=0.008;
    // stars
    stars.forEach(s=>{ ctx.globalAlpha = 0.4+0.4*Math.sin(t*2+s.tw); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*w,s.y*h,s.r,0,7); ctx.fill(); });
    ctx.globalAlpha=1;
    // globe
    const gx = w*0.78, gy = h*0.32, gr = Math.min(w,h)*0.16;
    ctx.save(); ctx.translate(gx,gy);
    ctx.beginPath(); ctx.arc(0,0,gr,0,7); ctx.fillStyle='rgba(38,198,218,0.12)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.stroke();
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.ellipse(0,0,gr*Math.abs(Math.cos(t+i)),gr,0,0,7); ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.stroke(); }
    for(let i=1;i<3;i++){ ctx.beginPath(); ctx.arc(0,0,gr*i/3,0,7); ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.stroke(); }
    // satellite orbiting
    const sx = Math.cos(t*1.3)*gr*1.5, sy = Math.sin(t*1.3)*gr*0.5;
    ctx.fillStyle='#FFB300'; ctx.beginPath(); ctx.arc(sx,sy,4,0,7); ctx.fill();
    ctx.restore();
    // mountains silhouette bottom
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.moveTo(0,h);
    ctx.lineTo(0,h*0.86); ctx.lineTo(w*0.12,h*0.74); ctx.lineTo(w*0.22,h*0.85); ctx.lineTo(w*0.35,h*0.7); ctx.lineTo(w*0.5,h*0.88); ctx.lineTo(w*0.68,h*0.78); ctx.lineTo(w*0.82,h*0.9); ctx.lineTo(w,h*0.8); ctx.lineTo(w,h); ctx.closePath(); ctx.fill();
    requestAnimationFrame(draw);
  }
  draw();
})();

/* Splash progress + entry */
(function(){
  const bar = document.getElementById('splash-bar');
  const label = document.getElementById('splash-label');
  let pct = 0;
  const msgs = ['Loading 10 simulations…','Calibrating instruments…','Charting the map centre…','Preparing your dashboard…','Ready to explore!'];
  const interval = setInterval(()=>{
    pct += 18 + Math.random()*10;
    if(pct>100) pct=100;
    bar.style.width = pct+'%';
    label.textContent = msgs[Math.min(msgs.length-1, Math.floor(pct/22))];
    if(pct>=100) clearInterval(interval);
  }, 260);

  function enter(){
    document.getElementById('splash').style.transition='opacity .5s ease';
    document.getElementById('splash').style.opacity='0';
    setTimeout(()=>{ document.getElementById('splash').style.display='none'; }, 500);
  }
  document.getElementById('enter-app').addEventListener('click', enter);
})();

/* Register service worker for offline support */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>

<script src="js/app.js"></script>
<script src="js/pages.js"></script>

<script src="js/simulations/05-weather-climate.js"></script>

<script src="js/simulations/07-river-landforms.js"></script>
<script src="js/simulations/08-lat-long.js"></script>
<script src="js/simulations/09-population.js"></script>
<script src="js/simulations/10-resources.js"></script>
<script>initApp();</script>
</body>
</html>
