<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Earth Science Laboratory</title>
<meta name="description" content="Ten interactive offline Earth Science simulations — rocks, soil, hazards and deep time.">
<meta name="theme-color" content="#0D47A1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="flask">🧪</div>
  <h1>Virtual Earth Science Laboratory</h1>
  <p class="tagline">Investigate Earth's rocks, hazards &amp; deep time — one variable at a time.</p>
  <div class="dev">Created by <b>Dr. Mateen Yousuf</b><br>Teacher · School Education Department, Kashmir</div>
</div>

<div id="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo">🌍</span>
      <span class="txt">Earth Lab<small>Virtual Science Laboratory</small></span>
    </div>

    <div class="nav-group">
      <div class="nav-label">Explore</div>
      <button class="nav-item" data-route="dashboard"><span class="ic">🏠</span>Home Dashboard</button>
      <button class="nav-item" data-route="handbook"><span class="ic">📘</span>Earth Science Handbook</button>
      <button class="nav-item" data-route="gallery"><span class="ic">💎</span>Rock &amp; Mineral Gallery</button>
      <button class="nav-item" data-route="quizcentre"><span class="ic">📝</span>Quiz Centre</button>
      <button class="nav-item" data-route="glossary"><span class="ic">🔤</span>Glossary</button>
      <button class="nav-item" data-route="about"><span class="ic">👤</span>About Developer</button>
    </div>

    <div class="nav-group">
      <div class="nav-label">10 Simulations</div>
      <div id="sidebarSimList"></div>
    </div>

    <div class="progress-card">
      <div class="lvl-row"><span id="pcLevel">Lv.1</span><span id="pcXP">0 XP</span></div>
      <div class="progress-bar"><i id="pcBar" style="width:0%"></i></div>
      <div class="sub" id="pcModules">0/10 modules complete</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">☰</button>
      <div class="search-wrap">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search simulations, e.g. volcano, fossil, plate…" autocomplete="off">
        <div class="search-results hidden" id="searchResults"></div>
      </div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">🌓</button>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<!-- BOTTOM NAV (mobile) -->
<nav class="bottom-nav">
  <div class="bn-row">
    <button data-route="dashboard"><span class="ic">🏠</span>Home</button>
    <button data-route="handbook"><span class="ic">📘</span>Handbook</button>
    <button data-route="quizcentre"><span class="ic">📝</span>Quiz</button>
    <button data-route="gallery"><span class="ic">💎</span>Gallery</button>
    <button data-route="about"><span class="ic">👤</span>About</button>
  </div>
</nav>

<div id="toast"></div>

<script src="js/app.js"></script>
<script src="js/simulations/rockcycle.js"></script>
<script src="js/simulations/soil.js"></script>
<script src="js/simulations/weathering.js"></script>
<script src="js/simulations/erosion.js"></script>
<script src="js/simulations/fossil.js"></script>
<script src="js/simulations/earthquake.js"></script>
<script src="js/simulations/volcano.js"></script>
<script src="js/simulations/plates.js"></script>
<script src="js/simulations/minerals.js"></script>
<script src="js/simulations/timeline.js"></script>
</body>
</html>
